<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Splitwise</title>
    <style>
      :root {
        --ink: #123f72;
        --soft-ink: #315f91;
        --muted: #6f8090;
        --paper: #e1e5df;
        --panel: #fffbe4;
        --panel-strong: #fff5c7;
        --line: #123f72;
        --accent: #1f66a5;
        --accent-dark: #0d4278;
        --rose: #f04a2a;
        --sky: #5b88b7;
        --gold: #f7d35d;
        --lilac: #d7e1dd;
        --lime: #eef2df;
        --shadow-hard: 8px 9px 0 rgba(20, 34, 46, 0.34);
        --shadow-soft: 0 18px 38px rgba(21, 35, 48, 0.22);
        --radius: 4px;
        --font-sans: "Source Han Sans SC", "思源黑体", "Noto Sans CJK SC", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      }

      * {
        box-sizing: border-box;
      }

      html {
        color-scheme: light;
      }

      body {
        margin: 0;
        min-height: 100vh;
        color: var(--ink);
        background:
          radial-gradient(circle at 20% 10%, rgba(255, 251, 228, 0.45), transparent 22%),
          radial-gradient(circle at 82% 6%, rgba(91, 136, 183, 0.22), transparent 26%),
          linear-gradient(135deg, #b8c1bd 0%, #d7ddd6 46%, #aeb8b4 100%);
        font-family: var(--font-sans);
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background-image:
          linear-gradient(90deg, rgba(18, 63, 114, 0.09) 1px, transparent 1px),
          linear-gradient(rgba(18, 63, 114, 0.07) 1px, transparent 1px);
        background-size: 54px 54px;
        mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0.95), transparent 86%);
      }

      button,
      input,
      select {
        font: inherit;
      }

      button {
        -webkit-tap-highlight-color: transparent;
      }

      .app-shell {
        width: min(100%, 980px);
        margin: 0 auto;
        padding: max(18px, env(safe-area-inset-top)) 14px 34px;
      }

      .topbar {
        position: relative;
        display: grid;
        place-items: center;
        margin-bottom: 18px;
        border: 3px solid var(--line);
        border-radius: 2px;
        background:
          radial-gradient(circle at 0 50%, transparent 0 12px, var(--line) 13px 15px, transparent 16px),
          radial-gradient(circle at 100% 50%, transparent 0 12px, var(--line) 13px 15px, transparent 16px),
          repeating-linear-gradient(0deg, transparent 0 30px, rgba(18, 63, 114, 0.08) 30px 32px),
          var(--panel);
        padding: clamp(22px, 6vw, 54px) 28px;
        box-shadow: var(--shadow-hard);
        overflow: hidden;
      }

      .topbar > * {
        position: relative;
        z-index: 1;
      }

      .topbar::before {
        content: "";
        position: absolute;
        inset: 10px;
        pointer-events: none;
        border: 2px dashed rgba(18, 63, 114, 0.42);
        border-radius: 2px;
      }

      .sync-pill {
        position: fixed;
        right: 12px;
        bottom: 12px;
        z-index: 5;
        max-width: min(280px, calc(100vw - 24px));
        border: 2px solid var(--line);
        border-radius: 2px;
        background: var(--panel-strong);
        color: var(--ink);
        padding: 7px 10px;
        font-family: var(--font-sans);
        font-size: 0.78rem;
        font-weight: 900;
        box-shadow: 4px 4px 0 rgba(20, 34, 46, 0.28);
      }

      .sync-pill[data-state="online"] {
        background: var(--accent);
        color: var(--panel);
      }

      .sync-pill[data-state="error"] {
        background: var(--rose);
        color: var(--panel);
      }

      label span,
      .section-head span,
      .balance-card span,
      .total-tile span,
      .form-head span,
      .settlement-list span {
        color: var(--muted);
        font-family: var(--font-sans);
        font-size: 0.82rem;
      }

      h1,
      h2,
      p {
        margin: 0;
      }

      h1 {
        max-width: 7em;
        color: var(--accent);
        font-family: Georgia, "Times New Roman", var(--font-sans);
        font-size: clamp(2.45rem, 13vw, 5.25rem);
        font-weight: 950;
        line-height: 0.86;
        letter-spacing: 0;
        text-transform: uppercase;
        text-align: center;
        text-shadow: 2px 2px 0 var(--panel), 5px 5px 0 var(--rose);
      }

      h2 {
        font-size: 1.06rem;
      }

      .text-button,
      .primary-button,
      .delete-row,
      .settle-button {
        border: 1.5px solid var(--line);
        border-radius: var(--radius);
        color: var(--ink);
        cursor: pointer;
      }

      .totals-board,
      .balance-grid {
        display: grid;
        gap: 9px;
      }

      .balance-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .total-tile,
      .balance-card {
        border: 3px solid var(--line);
        border-radius: var(--radius);
        background: var(--panel);
        box-shadow: var(--shadow-hard);
      }

      .totals-board {
        grid-template-columns: 1fr 1fr;
        margin: 0 0 16px;
      }

      .total-tile {
        min-height: 92px;
        display: grid;
        align-content: space-between;
        padding: 12px;
        background:
          repeating-linear-gradient(90deg, transparent 0 12px, rgba(18, 63, 114, 0.08) 12px 14px),
          var(--sky);
        color: var(--panel);
      }

      .total-tile span,
      .total-tile strong {
        color: var(--panel);
        text-shadow: 1px 1px 0 var(--accent-dark);
      }

      .total-tile.cny {
        background:
          repeating-linear-gradient(90deg, transparent 0 12px, rgba(18, 63, 114, 0.08) 12px 14px),
          var(--panel-strong);
        color: var(--ink);
      }

      .total-tile.cny span,
      .total-tile.cny strong {
        color: var(--ink);
        text-shadow: none;
      }

      .total-tile strong {
        font-size: clamp(1.45rem, 8vw, 2.6rem);
        line-height: 1;
      }

      .entry-form,
      .balance-panel,
      .stats-section,
      .ledger-section {
        margin-top: 16px;
        border: 3px solid var(--line);
        border-radius: 2px;
        background:
          linear-gradient(90deg, var(--rose) 0 10px, transparent 10px calc(100% - 10px), var(--rose) calc(100% - 10px)),
          var(--panel);
        box-shadow: var(--shadow-soft);
      }

      .entry-form {
        display: grid;
        gap: 13px;
        padding: 14px;
      }

      .entry-form::before,
      .balance-panel::before,
      .stats-section::before,
      .ledger-section::before {
        content: "";
        display: block;
        height: 10px;
        margin: -2px -2px 2px;
        border-bottom: 2px solid var(--line);
        background: repeating-linear-gradient(90deg, var(--line) 0 10px, transparent 10px 22px);
        opacity: 0.18;
      }

      .form-head,
      .section-head,
      .split-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .member-stack {
        display: flex;
        isolation: isolate;
      }

      .member-stack span {
        display: grid;
        width: 30px;
        height: 30px;
        margin-left: -5px;
        place-items: center;
        border: 1.5px solid var(--line);
        border-radius: 50%;
        background: var(--gold);
        color: var(--ink);
        font-family: var(--font-sans);
        font-size: 0.76rem;
        font-weight: 900;
      }

      .member-stack span:first-child {
        margin-left: 0;
        background: var(--accent);
        color: #fffaf1;
      }

      .member-stack span:last-child {
        background: var(--rose);
        color: #fffaf1;
      }

      label {
        display: grid;
        gap: 7px;
      }

      input,
      select {
        width: 100%;
        min-height: 50px;
        border: 2px solid var(--line);
        border-radius: 2px;
        background: #fffdf0;
        color: var(--ink);
        padding: 0 12px;
        outline: none;
        box-shadow: 2px 2px 0 rgba(20, 34, 46, 0.18);
      }

      .quick-row {
        display: grid;
        grid-template-columns: minmax(0, 1.12fr) minmax(0, 0.9fr) minmax(0, 0.72fr) minmax(0, 0.85fr) minmax(0, 0.78fr);
        gap: 6px;
        align-items: end;
      }

      .quick-row label {
        display: grid;
        grid-template-rows: auto 44px;
        min-width: 0;
      }

      .quick-row input,
      .quick-row select {
        height: 44px;
        min-height: 44px;
        padding: 0 6px;
        font-size: 0.9rem;
        line-height: 1;
      }

      input[type="checkbox"],
      input[type="radio"] {
        width: auto;
        min-height: auto;
        margin: 0;
        accent-color: var(--accent);
      }

      input::placeholder {
        color: rgba(119, 111, 101, 0.72);
      }

      input:focus,
      select:focus,
      button:focus-visible {
        outline: 3px solid rgba(12, 124, 112, 0.23);
        outline-offset: 2px;
      }

      .split-box {
        display: grid;
        gap: 12px;
        border: 2px dashed var(--line);
        border-radius: 2px;
        background:
          repeating-linear-gradient(0deg, transparent 0 28px, rgba(18, 63, 114, 0.1) 28px 30px),
          #fffdf0;
        padding: 12px;
      }

      #split-error {
        color: var(--rose);
        font-family: var(--font-sans);
        font-size: 0.78rem;
        text-align: right;
      }

      .method-tabs,
      .participant-grid {
        display: grid;
        gap: 8px;
        grid-template-columns: repeat(3, 1fr);
      }

      .method-tabs label,
      .participant-grid label {
        position: relative;
        display: flex;
        min-height: 42px;
        align-items: center;
        justify-content: center;
        gap: 6px;
        border: 2px solid var(--line);
        border-radius: 2px;
        background: #fffdf8;
        cursor: pointer;
      }

      .method-tabs label {
        background: var(--panel-strong);
        text-transform: uppercase;
      }

      .participant-grid label {
        width: min(58px, 100%);
        min-height: 0;
        aspect-ratio: 1;
        justify-self: center;
        border-radius: 50%;
        font-size: 0.96rem;
      }

      .participant-grid label:nth-child(1) {
        background: var(--accent);
        color: var(--panel);
      }

      .participant-grid label:nth-child(2) {
        background: var(--panel-strong);
      }

      .participant-grid label:nth-child(3) {
        background: var(--rose);
        color: var(--panel);
      }

      .method-tabs input,
      .participant-grid input {
        position: absolute;
        opacity: 0;
      }

      .method-tabs label:has(input:checked) {
        background: var(--gold);
        color: var(--ink);
        box-shadow: 3px 3px 0 var(--line);
      }

      .participant-grid label:has(input:checked) {
        color: var(--ink);
        box-shadow: 3px 3px 0 var(--line);
      }

      .participant-grid label:nth-child(1):has(input:checked) {
        background: var(--accent);
        color: #fffaf1;
      }

      .participant-grid label:nth-child(2):has(input:checked) {
        background: var(--gold);
      }

      .participant-grid label:nth-child(3):has(input:checked) {
        background: var(--rose);
        color: #fffaf1;
      }

      .method-tabs span,
      .participant-grid span {
        color: inherit;
        font-size: 0.86rem;
        font-weight: 800;
      }

      .share-editor {
        display: grid;
        gap: 8px;
      }

      .share-row {
        display: grid;
        grid-template-columns: minmax(72px, 1fr) minmax(0, 1.25fr) auto;
        align-items: center;
        gap: 8px;
        min-height: 48px;
        border: 2px solid rgba(18, 63, 114, 0.78);
        border-radius: 2px;
        background: #fffdf0;
        padding: 7px 9px;
      }

      .share-row span {
        color: var(--soft-ink);
        font-family: var(--font-sans);
        font-size: 0.86rem;
        font-weight: 800;
      }

      .share-row input {
        min-height: 38px;
        text-align: right;
      }

      .share-row.auto {
        background: var(--panel-strong);
      }

      .share-row.auto input {
        border-style: dashed;
        color: var(--muted);
      }

      .share-row em {
        color: var(--muted);
        font-family: var(--font-mono);
        font-size: 0.78rem;
        font-style: normal;
      }

      .file-drop {
        position: relative;
        min-height: 74px;
        border: 2px dashed var(--line);
        border-radius: 2px;
        background:
          linear-gradient(90deg, var(--rose) 0 12px, transparent 12px calc(100% - 12px), var(--rose) calc(100% - 12px)),
          var(--panel-strong);
        padding: 12px;
        overflow: hidden;
      }

      .file-drop input {
        position: absolute;
        inset: 0;
        opacity: 0;
        cursor: pointer;
      }

      .file-drop b {
        align-self: end;
        font-size: 1.02rem;
      }

      .receipt-preview {
        display: grid;
        gap: 10px;
        grid-template-columns: 82px 1fr;
        align-items: center;
        border: 1.5px solid var(--line);
        border-radius: var(--radius);
        background: #fffdf8;
        padding: 8px;
      }

      .receipt-preview img {
        width: 82px;
        height: 82px;
        object-fit: cover;
        border: 1px solid rgba(36, 33, 29, 0.25);
        border-radius: 6px;
      }

      .text-button {
        min-height: 40px;
        background: var(--panel);
        padding: 0 12px;
        justify-self: start;
      }

      .primary-button {
        min-height: 54px;
        border-radius: 2px;
        background: var(--accent);
        color: var(--panel);
        font-weight: 900;
        text-transform: uppercase;
        box-shadow: var(--shadow-hard);
      }

      .primary-button:disabled {
        cursor: wait;
        filter: grayscale(0.3);
        opacity: 0.72;
      }

      .text-button:hover,
      .delete-row:hover,
      .settle-button:hover,
      .primary-button:hover {
        filter: saturate(1.12) contrast(1.04);
        transform: translate(-1px, -1px);
      }

      .primary-button:active {
        transform: translate(3px, 3px);
        box-shadow: 2px 2px 0 var(--line);
      }

      .balance-panel,
      .stats-section,
      .ledger-section {
        padding: 14px;
      }

      .section-head {
        margin-bottom: 12px;
      }

      .exchange-row {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 10px;
        align-items: end;
        margin-bottom: 12px;
      }

      .exchange-row input {
        min-height: 42px;
      }

      .settle-button {
        min-height: 42px;
        border-radius: 2px;
        background: var(--rose);
        color: var(--panel);
        font-weight: 900;
        padding: 0 14px;
        box-shadow: 3px 3px 0 var(--line);
      }

      .balance-card {
        position: relative;
        display: grid;
        gap: 9px;
        min-width: 0;
        padding: 10px;
      }

      .balance-card strong {
        font-size: 1.12rem;
        line-height: 1.2;
      }

      .balance-card em {
        color: var(--muted);
        font-family: var(--font-sans);
        font-size: 0.75rem;
        font-style: normal;
      }

      .balance-lines {
        display: grid;
        gap: 7px;
      }

      .balance-lines b {
        min-width: 0;
        overflow-wrap: anywhere;
        color: var(--soft-ink);
        font-size: clamp(0.95rem, 4vw, 1.26rem);
        line-height: 1.1;
        text-align: left;
        white-space: nowrap;
      }

      .balance-lines b.positive {
        color: var(--accent-dark);
      }

      .balance-lines b.negative {
        color: var(--rose);
      }

      .balance-lines b.zero {
        color: var(--muted);
      }

      .balance-card.positive {
        background:
          linear-gradient(90deg, rgba(31, 102, 165, 0.12), transparent 36%),
          var(--panel);
      }

      .balance-card.positive strong {
        color: var(--accent-dark);
      }

      .balance-card.negative {
        background:
          linear-gradient(90deg, rgba(240, 74, 42, 0.13), transparent 36%),
          var(--panel);
      }

      .balance-card.negative strong {
        color: var(--rose);
      }

      .settlement-list {
        display: grid;
        gap: 8px;
        margin-top: 12px;
      }

      .settlement-list:empty {
        display: none;
      }

      .settlement-list div,
      .settlement-list > span,
      .settlement-list > strong {
        border: 2px solid var(--line);
        border-radius: 2px;
        background: var(--panel);
        padding: 10px;
        box-shadow: 4px 4px 0 rgba(20, 34, 46, 0.24);
      }

      .settlement-list div {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .stats-wrap {
        overflow: auto;
        border: 3px solid var(--line);
        border-radius: 2px;
        background: var(--panel);
        overscroll-behavior: contain;
        -webkit-overflow-scrolling: touch;
      }

      .stats-table {
        width: 100%;
        min-width: 430px;
        border-collapse: collapse;
        table-layout: fixed;
      }

      .stats-table th:first-child,
      .stats-table td:first-child {
        position: sticky;
        left: 0;
        z-index: 2;
        background: var(--panel-strong);
      }

      .stats-table thead th:first-child {
        z-index: 3;
        background: var(--accent);
      }

      .stats-table tfoot td {
        background: rgba(247, 211, 93, 0.28);
        font-weight: 900;
      }

      .stats-table th,
      .stats-table td {
        padding: 8px 9px;
        line-height: 1.15;
      }

      .stats-table th {
        font-size: 0.96rem;
      }

      .stats-table td {
        font-size: 0.86rem;
        white-space: nowrap;
      }

      .stats-category {
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
        font-size: 0.92rem;
        line-height: 1.15;
      }

      .stats-empty {
        display: grid;
        place-items: center;
        gap: 7px;
        min-height: 132px;
        padding: 22px;
        text-align: center;
      }

      .stats-empty strong {
        color: var(--ink);
        font-size: 1rem;
      }

      .table-wrap {
        position: relative;
        overflow-x: auto;
        max-height: 62vh;
        overscroll-behavior: contain;
        border: 3px solid var(--line);
        border-radius: 2px;
        background: var(--panel);
        -webkit-overflow-scrolling: touch;
      }

      table {
        width: 100%;
        min-width: 930px;
        border-collapse: collapse;
      }

      th,
      td {
        border-bottom: 1px dashed rgba(18, 63, 114, 0.34);
        padding: 11px 10px;
        text-align: left;
        vertical-align: middle;
      }

      th {
        position: sticky;
        top: 0;
        z-index: 1;
        background: var(--accent);
        color: var(--panel);
        font-family: var(--font-sans);
        font-size: 0.78rem;
      }

      td {
        font-size: 0.95rem;
      }

      tbody tr:nth-child(even) {
        background: rgba(31, 102, 165, 0.08);
      }

      tbody tr:hover {
        background: rgba(247, 211, 93, 0.22);
      }

      .receipt-thumb {
        display: block;
        width: 40px;
        height: 40px;
        border: 1px solid rgba(36, 33, 29, 0.3);
        border-radius: 6px;
        object-fit: cover;
      }

      .delete-row {
        min-height: 34px;
        border-radius: 2px;
        background: var(--panel-strong);
        padding: 0 10px;
      }

      .split-summary {
        display: inline-block;
        max-width: 260px;
        color: var(--soft-ink);
        font-family: var(--font-sans);
        font-size: 0.83rem;
        line-height: 1.35;
      }

      .ledger-tools {
        display: grid;
        grid-template-columns: minmax(0, 0.8fr) minmax(0, 1.2fr);
        gap: 10px;
        margin-bottom: 12px;
      }

      .ledger-tools label {
        grid-template-rows: auto 42px;
      }

      .ledger-tools select {
        height: 42px;
        min-height: 42px;
      }

      .reveal {
        animation: lift-in 520ms ease both;
      }

      .reveal:nth-of-type(2) {
        animation-delay: 70ms;
      }

      .reveal:nth-of-type(3) {
        animation-delay: 120ms;
      }

      .reveal:nth-of-type(4) {
        animation-delay: 170ms;
      }

      @keyframes lift-in {
        from {
          opacity: 0;
          transform: translateY(14px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @media (max-width: 760px) {
        .totals-board {
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 8px;
        }

        .total-tile {
          min-height: 78px;
          padding: 10px;
        }

        .total-tile strong {
          font-size: clamp(1.35rem, 9vw, 2rem);
        }

        .quick-row {
          grid-template-columns: 1.08fr 0.88fr 0.68fr 0.82fr 0.72fr;
          gap: 5px;
        }

        .quick-row input,
        .quick-row select {
          height: 40px;
          min-height: 40px;
          padding: 0 5px;
          font-size: 0.82rem;
        }

        .balance-grid {
          grid-template-columns: repeat(3, minmax(0, 1fr));
          gap: 7px;
        }

        .balance-card {
          padding: 8px;
        }

        .balance-lines b {
          font-size: clamp(0.78rem, 3.6vw, 1rem);
        }

        .ledger-tools {
          grid-template-columns: minmax(0, 0.8fr) minmax(0, 1.2fr);
          gap: 8px;
        }

        .ledger-section table {
          min-width: 760px;
        }
      }

      @media (max-width: 560px) {
        .app-shell {
          padding-inline: 10px;
        }

        .topbar {

    <script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore-compat.js"></script>
    <script>
      const members = ["谢", "蓝", "王"];
      const memberAliases = { 蓝旻颉: "蓝", 王迪: "王" };
      const storageKey = "shared-ledger-v2";
      const cloudLedgerId = "trip-ledger";
      const firebaseConfig = {
        apiKey: "AIzaSyDRpnlB5_puzZXPEpyMVgEjHy4knXXPUT4",
        authDomain: "seperise-90095.firebaseapp.com",
        projectId: "seperise-90095",
        storageBucket: "seperise-90095.firebasestorage.app",
        messagingSenderId: "435990117449",
        appId: "1:435990117449:web:7ef668aa2d0c4ea12c5398",
        measurementId: "G-S5FBZWLREL",
      };

      const form = document.querySelector("#entry-form");
      const categoryInput = document.querySelector("#category");
      const paymentInput = document.querySelector("#payment");
      const noteInput = document.querySelector("#note");
      const payerInput = document.querySelector("#payer");
      const amountInput = document.querySelector("#amount");
      const submitEntryButton = document.querySelector("#submit-entry");
      const currencyInput = document.querySelector("#currency");
      const receiptInput = document.querySelector("#receipt");
      const receiptPreview = document.querySelector("#receipt-preview");
      const receiptImage = document.querySelector("#receipt-image");
      const removeReceiptButton = document.querySelector("#remove-receipt");
      const syncStatus = document.querySelector("#sync-status");
      const splitPreview = document.querySelector("#split-preview");
      const splitError = document.querySelector("#split-error");
      const splitMethods = document.querySelector("#split-methods");
      const participants = document.querySelector("#participants");
      const shareEditor = document.querySelector("#share-editor");
      const ledgerBody = document.querySelector("#ledger-body");
      const ledgerFilterField = document.querySelector("#ledger-filter-field");
      const ledgerFilterValue = document.querySelector("#ledger-filter-value");
      const balanceGrid = document.querySelector("#balance-grid");
      const entryCount = document.querySelector("#entry-count");
      const totalUsd = document.querySelector("#total-usd");
      const totalCny = document.querySelector("#total-cny");
      const exchangeRateInput = document.querySelector("#exchange-rate");
      const settleButton = document.querySelector("#settle-button");
      const settlementList = document.querySelector("#settlement-list");
      const categoryStatsTable = document.querySelector("#category-stats-table");
      const categories = [...categoryInput.options].map((option) => option.value);

      let entries = loadEntries();
      let pendingReceipt = "";
      let receiptProcessing = false;
      let cloudDb = null;
      let cloudReady = false;
      let applyingCloudSnapshot = false;
      let cloudSnapshotSeen = false;

      function normalizeMember(member) {
        return memberAliases[member] || member;
      }

      function normalizeEntry(entry, index = 0) {
        const shares = {};
        Object.entries(entry.shares || {}).forEach(([member, value]) => {
          const normalized = normalizeMember(member);
          shares[normalized] = (shares[normalized] || 0) + Number(value || 0);
        });
        const idTime = Number(String(entry.id || "").split("-")[0]);
        return {
          ...entry,
          createdAt: Number(entry.createdAt) || (Number.isFinite(idTime) ? idTime : -index),
          payment: entry.payment || "其他",
          note: entry.note || entry.title || "",
          payer: normalizeMember(entry.payer),
          participants: (entry.participants || members).map(normalizeMember),
          shares: Object.keys(shares).length ? shares : entry.shares,
        };
      }

      function loadEntries() {
        try {
          const stored = JSON.parse(localStorage.getItem(storageKey)) || JSON.parse(localStorage.getItem("shared-ledger-v1")) || [];
          return stored.map(normalizeEntry);
        } catch {
          return [];
        }
      }

      function saveEntries() {
        try {
          localStorage.setItem(storageKey, JSON.stringify(entries));
          return true;
        } catch {
          splitError.textContent = "凭证图片过大，已无法保存到浏览器本地账本";
          return false;
        }
      }

      function hasFirebaseConfig() {
        return Boolean(firebaseConfig.apiKey && firebaseConfig.projectId && window.firebase);
      }

      function entryCollection() {
        return cloudDb.collection("splitwiseLedgers").doc(cloudLedgerId).collection("entries");
      }

      function setSyncStatus(message, state = "local") {
        syncStatus.textContent = message;
        syncStatus.dataset.state = state;
      }

      function startCloudSync() {
        if (!hasFirebaseConfig()) {
          setSyncStatus("本地模式", "local");
          return;
        }

        try {
          firebase.initializeApp(firebaseConfig);
          cloudDb = firebase.firestore();
          cloudReady = true;
          setSyncStatus("连接云端...", "local");
          entryCollection()
            .orderBy("createdAt", "desc")
            .onSnapshot(
              (snapshot) => {
                if (!cloudSnapshotSeen && snapshot.empty && entries.length) {
                  cloudSnapshotSeen = true;
                  setSyncStatus("正在初始化云端账本...", "local");
                  entries.forEach(syncEntryToCloud);
                  return;
                }
                cloudSnapshotSeen = true;
                applyingCloudSnapshot = true;
                entries = snapshot.docs.map((doc, index) => normalizeEntry({ id: doc.id, ...doc.data() }, index));
                saveEntries();
                applyingCloudSnapshot = false;
                render();
                setSyncStatus("云同步已连接", "online");
              },
              (error) => {
                cloudReady = false;
                setSyncStatus(`同步失败：${error.message || "请检查 Firestore"}`, "error");
              }
            );
        } catch (error) {
          cloudReady = false;
          setSyncStatus(`同步失败：${error.message || "请检查 Firebase 配置"}`, "error");
        }
      }

      function syncEntryToCloud(entry) {
        if (!cloudReady || applyingCloudSnapshot) return;
        entryCollection().doc(entry.id).set(entry).catch(() => {
          splitError.textContent = "云同步失败，本机已保存";
          setSyncStatus("写入云端失败", "error");
        });
      }

      function deleteEntryFromCloud(id) {
        if (!cloudReady || applyingCloudSnapshot) return;
        entryCollection().doc(id).delete().catch(() => {
          splitError.textContent = "云端删除失败，请稍后重试";
          setSyncStatus("删除云端记录失败", "error");
        });
      }

      function getAmount() {
        return Number(amountInput.value);
      }

      function getCurrency() {
        return currencyInput.value;
      }

      function getMethod() {
        return form.elements.splitMethod.value;
      }

      function getSelectedMembers() {
        return [...participants.querySelectorAll("input:checked")].map((input) => input.value);
      }

      function money(value, currency) {
        const amount = Number(value || 0);
        const symbol = currency === "CNY" ? "¥" : "$";
        return `${amount < 0 ? "-" : ""}${symbol}${formatNumber(Math.abs(amount))}`;
      }

      function formatNumber(value) {
        const amount = Number(value || 0);
        return new Intl.NumberFormat("en-US", {
          minimumFractionDigits: 0,
          maximumFractionDigits: 2,
        }).format(amount);
      }

      function amountTone(value) {
        const amount = Number(value || 0);
        if (amount > 0.009) return "positive";
        if (amount < -0.009) return "negative";
        return "zero";
      }

      function currencyUnit(currency) {
        return currency === "CNY" ? "¥" : "$";
      }

      function escapeHtml(value) {
        return String(value).replace(/[&<>"']/g, (char) => {
          const entities = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" };
          return entities[char];
        });
      }

      function createId() {
        return window.crypto && crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random().toString(16).slice(2)}`;
      }

      function today() {
        return new Intl.DateTimeFormat("zh-CN", { month: "2-digit", day: "2-digit" }).format(new Date());
      }

      function labelForMethod(method) {
        return { equal: "平摊", amount: "按金额", percent: "按比例" }[method] || "平摊";
      }

      function keepNumericInput(input) {
        input.addEventListener("beforeinput", (event) => {
          if (!event.data) return;
          const nextValue = `${input.value.slice(0, input.selectionStart)}${event.data}${input.value.slice(input.selectionEnd)}`;
          if (!/^\d*\.?\d*$/.test(nextValue)) event.preventDefault();
        });
      }

      function readShareValue(member) {
        const input = [...shareEditor.querySelectorAll("[data-share-member]")].find((field) => field.dataset.shareMember === member);
        return input && input.value.trim() ? Number(input.value) : null;
      }

      function getAutoMember(selected) {
        if (selected.length <= 1) return selected[0];
        const blankMembers = selected.filter((member) => readShareValue(member) === null);
        return blankMembers.length === 1 ? blankMembers[0] : null;
      }

      function calculateShares({ silent = false } = {}) {
        const amount = getAmount();
        const currency = getCurrency();
        const method = getMethod();
        const selected = getSelectedMembers();
        const shares = {};

        members.forEach((member) => {
          shares[member] = 0;
        });

        if (!Number.isFinite(amount) || amount <= 0) {
          if (!silent) splitError.textContent = "请输入有效金额";
          return null;
        }

        if (!selected.length) {
          if (!silent) splitError.textContent = "至少选择 1 位参与者";
          return null;
        }

        if (method === "equal") {
          selected.forEach((member) => {
            shares[member] = amount / selected.length;
          });
        }

        if (method === "amount") {
          const autoMember = getAutoMember(selected);
          let used = 0;
          selected.forEach((member) => {
            if (member === autoMember) return;
            shares[member] = readShareValue(member) || 0;
            used += shares[member];
          });
          if (autoMember) shares[autoMember] = amount - used;
        }

        if (method === "percent") {
          const autoMember = getAutoMember(selected);
          let usedPercent = 0;
          selected.forEach((member) => {
            if (member === autoMember) return;
            const percent = readShareValue(member) || 0;
            usedPercent += percent;
            shares[member] = amount * (percent / 100);
          });
          if (autoMember) shares[autoMember] = amount * ((100 - usedPercent) / 100);
        }

        if ((method === "amount" || method === "percent") && !getAutoMember(selected)) {
          const target = method === "amount" ? amount : 100;
          const used = selected.reduce((sum, member) => sum + (method === "amount" ? shares[member] : readShareValue(member) || 0), 0);
          if (Math.abs(used - target) > 0.01) {
            if (!silent) splitError.textContent = method === "amount" ? "请留空 1 人自动补差，或让金额合计等于总金额" : "请留空 1 人自动补差，或让比例合计等于 100%";
            return null;
          }
        }

        const hasNegativeShare = selected.some((member) => shares[member] < -0.000001);
        if (hasNegativeShare) {
          if (!silent) splitError.textContent = method === "amount" ? "已输入金额不能超过总金额" : "已输入比例不能超过 100%";
          return null;
        }

        splitError.textContent = "";
        return { amount, currency, method, participants: selected, shares };
      }

      function updateShareEditor() {
        const selected = getSelectedMembers();
        const method = getMethod();
        const amount = getAmount();
        const currency = getCurrency();

        if (method === "equal") {
          shareEditor.innerHTML = selected
            .map((member) => {
              const share = Number.isFinite(amount) && amount > 0 && selected.length ? amount / selected.length : 0;
              return `<div class="share-row auto"><span>${member}</span><strong>${money(share, currency)}</strong></div>`;
            })
            .join("");
          updateSplitPreview();
          return;
        }

        shareEditor.innerHTML = selected
          .map((member) => {
            const unit = method === "amount" ? currencyUnit(currency) : "%";
            return `<label class="share-row" data-share-row="${member}"><span>${member}</span><input data-share-member="${member}" type="text" inputmode="decimal" pattern="[0-9]*[.]?[0-9]*" placeholder="留空自动" /><em>${unit}</em></label>`;
          })
          .join("");

        shareEditor.querySelectorAll("input").forEach((input) => {
          keepNumericInput(input);
          input.addEventListener("input", updateSplitPreview);
        });
        updateSplitPreview();
      }

      function updateSplitPreview() {
        const result = calculateShares({ silent: true });
        const selected = getSelectedMembers();
        const method = getMethod();
        const amount = getAmount();
        const currency = getCurrency();

        if (!selected.length) {
          splitPreview.textContent = "请选择参与者";
          return;
        }

        if (!Number.isFinite(amount) || amount <= 0 || !result) {
          splitPreview.textContent = `${selected.length} 人 · ${labelForMethod(method)}`;
          return;
        }

        shareEditor.querySelectorAll(".share-row").forEach((row) => {
          const member = row.dataset.shareRow;
          const input = row.querySelector("input");
          const isAuto = member === getAutoMember(selected);
          row.classList.toggle("auto", isAuto);
          if (input && isAuto) {
            input.placeholder = method === "percent" ? `${formatNumber(Math.max(0, (result.shares[member] / amount) * 100))}%` : money(Math.max(0, result.shares[member]), currency);
          } else if (input) {
            input.placeholder = "0";
          }
        });

        if (method === "equal") {
          splitPreview.textContent = `${selected.length} 人平摊 · 每人 ${money(amount / selected.length, currency)}`;
          return;
        }

        splitPreview.textContent = `${selected.length} 人 · ${labelForMethod(method)}`;
      }

      function setReceiptPreview(src) {
        pendingReceipt = src;
        receiptImage.src = src;
        receiptPreview.hidden = !src;
      }

      function compressReceiptFile(file) {
        return new Promise((resolve, reject) => {
          const image = new Image();
          const objectUrl = URL.createObjectURL(file);
          image.addEventListener("load", () => {
            const maxSide = 900;
            const scale = Math.min(1, maxSide / Math.max(image.naturalWidth, image.naturalHeight));
            const canvas = document.createElement("canvas");
            canvas.width = Math.max(1, Math.round(image.naturalWidth * scale));
            canvas.height = Math.max(1, Math.round(image.naturalHeight * scale));
            const context = canvas.getContext("2d");
            context.fillStyle = "#fffdf0";
            context.fillRect(0, 0, canvas.width, canvas.height);
            context.drawImage(image, 0, 0, canvas.width, canvas.height);
            URL.revokeObjectURL(objectUrl);
            resolve(canvas.toDataURL("image/jpeg", 0.72));
          });
          image.addEventListener("error", () => {
            URL.revokeObjectURL(objectUrl);
            reject(new Error("receipt image failed"));
          });
          image.src = objectUrl;
        });
      }

      function entryShares(entry) {
        if (entry.shares) return entry.shares;
        const fallback = {};
        const selected = entry.participants || members;
        members.forEach((member) => {
          fallback[member] = selected.includes(member) ? entry.amount / selected.length : 0;
        });
        return fallback;
      }

      function getExchangeRate() {
        const rate = Number(exchangeRateInput.value);
        return Number.isFinite(rate) && rate > 0 ? rate : 6.78;
      }

      function amountAsCny(amount, currency) {
        return currency === "USD" ? amount * getExchangeRate() : amount;
      }

      function renderBalances() {
        const balances = {};
        const totals = { USD: 0, CNY: 0 };
        members.forEach((member) => {
          balances[member] = { USD: 0, CNY: 0 };
        });

        entries.forEach((entry) => {
          totals[entry.currency] += entry.amount;
          const shares = entryShares(entry);
          members.forEach((member) => {
            balances[member][entry.currency] -= shares[member] || 0;
          });
          balances[entry.payer][entry.currency] += entry.amount;
        });

        balanceGrid.innerHTML = members
          .map((member) => {
            const usd = balances[member].USD;
            const cny = balances[member].CNY;
            const totalMood = usd * getExchangeRate() + cny > 0 ? "positive" : usd * getExchangeRate() + cny < 0 ? "negative" : "";
            return `<article class="balance-card ${totalMood}"><strong>${member}</strong><div class="balance-lines"><b class="${amountTone(cny)}">${money(cny, "CNY")}</b><b class="${amountTone(usd)}">${money(usd, "USD")}</b></div><em>${totalMood === "positive" ? "应收" : totalMood === "negative" ? "应付" : "已平"}</em></article>`;
          })
          .join("");

        totalUsd.textContent = money(totals.USD, "USD");
        totalCny.textContent = money(totals.CNY, "CNY");
        if (settlementList.dataset.active === "true") renderSettlement();
      }

      function currentBalancesInCny() {
        const rate = getExchangeRate();
        const balances = {};
        members.forEach((member) => {
          balances[member] = 0;
        });
        entries.forEach((entry) => {
          const multiplier = entry.currency === "USD" ? rate : 1;
          const shares = entryShares(entry);
          members.forEach((member) => {
            balances[member] -= (shares[member] || 0) * multiplier;
          });
          balances[entry.payer] += entry.amount * multiplier;
        });
        return balances;
      }

      function settlementTransfers() {
        const balances = currentBalancesInCny();
        const debtors = [];
        const creditors = [];

        Object.entries(balances).forEach(([member, value]) => {
          const rounded = Math.round(value * 100) / 100;
          if (rounded < -0.01) debtors.push({ member, amount: Math.abs(rounded) });
          if (rounded > 0.01) creditors.push({ member, amount: rounded });
        });

        const transfers = [];
        let debtorIndex = 0;
        let creditorIndex = 0;
        while (debtorIndex < debtors.length && creditorIndex < creditors.length) {
          const debtor = debtors[debtorIndex];
          const creditor = creditors[creditorIndex];
          const amount = Math.min(debtor.amount, creditor.amount);
          transfers.push({ from: debtor.member, to: creditor.member, amount });
          debtor.amount = Math.round((debtor.amount - amount) * 100) / 100;
          creditor.amount = Math.round((creditor.amount - amount) * 100) / 100;
          if (debtor.amount <= 0.01) debtorIndex += 1;
          if (creditor.amount <= 0.01) creditorIndex += 1;
        }

        return transfers;
      }

      function renderSettlement() {
        settlementList.dataset.active = "true";
        const transfers = settlementTransfers();
        if (!entries.length) {
          settlementList.innerHTML = `<span>暂无可结算记录</span>`;
          return;
        }
        if (!transfers.length) {
          settlementList.innerHTML = `<strong>已结清</strong><span>按当前汇率无需转账</span>`;
          return;
        }
        settlementList.innerHTML = transfers.map((transfer) => `<div><strong>${transfer.from} → ${transfer.to}</strong><span>${money(transfer.amount, "CNY")}</span></div>`).join("");
      }

      function renderCategoryStats() {
        if (!entries.length) {
          categoryStatsTable.innerHTML = `
            <tbody>
              <tr>
                <td colspan="${members.length + 2}">
                  <div class="stats-empty">
                    <strong>统计票据等待第一笔消费</strong>
                    <span>录入后会自动按分类和成员折算成人民币。</span>
                  </div>
                </td>
              </tr>
            </tbody>
          `;
          return;
        }

        const categoryList = [...new Set([...categories, ...entries.map((entry) => entry.category || "未分类")])];
        const rows = {};
        const memberTotals = {};
        members.forEach((member) => {
          memberTotals[member] = 0;
        });

        categoryList.forEach((category) => {
          rows[category] = { total: 0 };
          members.forEach((member) => {
            rows[category][member] = 0;
          });
        });

        entries.forEach((entry) => {
          const category = entry.category || "未分类";
          if (!rows[category]) {
            rows[category] = { total: 0 };
            members.forEach((member) => {
              rows[category][member] = 0;
            });
            categoryList.push(category);
          }
          const shares = entryShares(entry);
          members.forEach((member) => {
            const value = amountAsCny(shares[member] || 0, entry.currency);
            rows[category][member] += value;
            rows[category].total += value;
            memberTotals[member] += value;
          });
        });

        const grandTotal = members.reduce((sum, member) => sum + memberTotals[member], 0);
        const bodyRows = categoryList
          .map((category) => {
            const row = rows[category];
            return `<tr><td data-label="分类"><strong class="stats-category">${escapeHtml(category)}</strong></td>${members.map((member) => `<td data-label="${member}">${money(row[member], "CNY")}</td>`).join("")}<td data-label="小计">${money(row.total, "CNY")}</td></tr>`;
          })
          .join("");

        categoryStatsTable.innerHTML = `
          <thead>
            <tr><th>分类</th>${members.map((member) => `<th>${member}</th>`).join("")}<th>小计</th></tr>
          </thead>
          <tbody>${bodyRows}</tbody>
          <tfoot>
            <tr><td>小计</td>${members.map((member) => `<td>${money(memberTotals[member], "CNY")}</td>`).join("")}<td>${money(grandTotal, "CNY")}</td></tr>
          </tfoot>
        `;
      }

      function renderShareSummary(entry) {
        const shares = entryShares(entry);
        const detail = (entry.participants || members).map((member) => `${member} ${money(shares[member] || 0, entry.currency)}`).join(" / ");
        return `${labelForMethod(entry.method)}：${detail}`;
      }

      function sortedEntries() {
        return [...entries].sort((a, b) => Number(b.createdAt || 0) - Number(a.createdAt || 0));
      }

      function filterLabel(field) {
        return { date: "日期", category: "分类", payer: "付款人" }[field] || "筛选内容";
      }

      function renderLedgerFilters() {
        const field = ledgerFilterField.value;
        const currentValue = ledgerFilterValue.value;

        if (field === "all") {
          ledgerFilterValue.innerHTML = `<option value="all">全部记录</option>`;
          ledgerFilterValue.disabled = true;
          return;
        }

        const values = [...new Set(sortedEntries().map((entry) => entry[field] || "未分类"))];
        const nextValue = values.includes(currentValue) ? currentValue : "all";
        ledgerFilterValue.disabled = false;
        ledgerFilterValue.innerHTML = [`<option value="all">全部${filterLabel(field)}</option>`, ...values.map((value) => `<option value="${escapeHtml(value)}">${escapeHtml(value)}</option>`)].join("");
        ledgerFilterValue.value = nextValue;
      }

      function filteredLedgerEntries() {
        const field = ledgerFilterField.value;
        const value = ledgerFilterValue.value;
        const ordered = sortedEntries();
        if (field === "all" || value === "all") return ordered;
        return ordered.filter((entry) => (entry[field] || "未分类") === value);
      }

      function renderLedger() {
        renderLedgerFilters();
        const visibleEntries = filteredLedgerEntries();
        entryCount.textContent = visibleEntries.length === entries.length ? `${entries.length} 笔` : `${visibleEntries.length}/${entries.length} 笔`;
        ledgerBody.innerHTML = visibleEntries
          .map((entry) => {
            const safeNote = escapeHtml(entry.note || "");
            const safeCategory = escapeHtml(entry.category || "未分类");
            const safePayment = escapeHtml(entry.payment || "其他");
            const safePayer = escapeHtml(entry.payer);
            const receipt = entry.receipt ? `<a href="${entry.receipt}" target="_blank" rel="noreferrer"><img class="receipt-thumb" src="${entry.receipt}" alt="${safeCategory} 凭证" /></a>` : "无";
            return `<tr><td data-label="日期">${entry.date}</td><td data-label="分类">${safeCategory}</td><td data-label="支付">${safePayment}</td><td data-label="备注">${safeNote || "无"}</td><td data-label="付款人">${safePayer}</td><td data-label="金额">${money(entry.amount, entry.currency)}</td><td data-label="分摊"><span class="split-summary">${escapeHtml(renderShareSummary(entry))}</span></td><td data-label="凭证">${receipt}</td><td data-label="操作"><button class="delete-row" type="button" data-id="${entry.id}">删除</button></td></tr>`;
          })
          .join("");
      }

      function render() {
        renderBalances();
        renderCategoryStats();
        renderLedger();
      }

      keepNumericInput(amountInput);
      keepNumericInput(exchangeRateInput);

      amountInput.addEventListener("input", updateShareEditor);
      currencyInput.addEventListener("change", updateShareEditor);
      exchangeRateInput.addEventListener("input", render);
      settleButton.addEventListener("click", renderSettlement);
      splitMethods.addEventListener("change", updateShareEditor);
      participants.addEventListener("change", updateShareEditor);
      ledgerFilterField.addEventListener("change", () => {
        ledgerFilterValue.value = "all";
        renderLedger();
      });
      ledgerFilterValue.addEventListener("change", renderLedger);

      receiptInput.addEventListener("change", async () => {
        const file = receiptInput.files[0];
        if (!file) return;
        receiptProcessing = true;
        submitEntryButton.disabled = true;
        submitEntryButton.textContent = "处理图片中...";
        splitError.textContent = "正在压缩凭证图片";
        try {
          const compressedReceipt = await compressReceiptFile(file);
          setReceiptPreview(compressedReceipt);
          splitError.textContent = "";
        } catch {
          receiptInput.value = "";
          setReceiptPreview("");
          splitError.textContent = "凭证图片读取失败，请换一张图片";
        } finally {
          receiptProcessing = false;
          submitEntryButton.disabled = false;
          submitEntryButton.textContent = "记一笔消费";
        }
      });

      removeReceiptButton.addEventListener("click", () => {
        receiptInput.value = "";
        setReceiptPreview("");
      });

      function addEntry() {
        if (receiptProcessing) {
          splitError.textContent = "凭证图片还在处理中，请稍等";
          return;
        }
        if (typeof form.reportValidity === "function" && !form.reportValidity()) return;
        const split = calculateShares();
        if (!split) return;

        const entry = {
          id: createId(),
          createdAt: Date.now(),
          date: today(),
          category: categoryInput.value,
          payment: paymentInput.value,
          note: noteInput.value.trim(),
          payer: payerInput.value,
          amount: split.amount,
          currency: split.currency,
          method: split.method,
          participants: split.participants,
          shares: split.shares,
          receipt: pendingReceipt,
        };

        entries.unshift(entry);
        if (!saveEntries()) {
          entries = entries.filter((item) => item.id !== entry.id);
          return;
        }
        syncEntryToCloud(entry);
        form.reset();
        setReceiptPreview("");
        updateShareEditor();
        render();
      }

      submitEntryButton.addEventListener("click", addEntry);

      form.addEventListener("submit", (event) => {
        event.preventDefault();
        addEntry();
      });

      ledgerBody.addEventListener("click", (event) => {
        const button = event.target.closest("[data-id]");
        if (!button) return;
        entries = entries.filter((entry) => entry.id !== button.dataset.id);
        saveEntries();
        deleteEntryFromCloud(button.dataset.id);
        render();
      });

      updateShareEditor();
      render();
      startCloudSync();
    </script>
  </body>
</html>
